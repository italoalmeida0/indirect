name: CI

# Cross-platform CI for llm-gateway:
#   - gateway: Bun-side gates on Linux only (lint, typecheck, unit+integration
#     tests, SPA build sanity).
#   - daemon: Go gates NATIVE on every OS/arch we ship — linux amd64/arm64,
#     windows amd64/arm64, macos amd64/arm64 (the daemon/launcher ship for all
#     six; killslot/spawn/pidalive/process-stop have OS variants), so every PR
#     runs the full suite on every target. fail-fast is off: we want the FULL
#     matrix verdict, not the first failure.
#   - daemon-musl: the full suite on a musl userland (Alpine) + a glibc-free
#     proof of the SHIPPED linux artifacts (exec on bare Alpine + static
#     assertion).
#   - daemon-race: the complete race detector on Linux.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - uses: actions/setup-go@v7
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - name: Cache the pinned zig toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/indirect-code/toolchains
          key: indirect-zig-${{ runner.os }}-${{ runner.arch }}

      - name: Build daemon for integration tests
        # Downloads (and caches) the pinned zig toolchain: the daemon links
        # QuickJS through cgo, so a bare `go build` is no longer enough.
        run: bun run build:daemon

      - name: Unit + integration tests
        run: bun test

      - name: SPA build sanity
        run: bun run build:web

      - name: Transcript browser regressions
        run: |
          mkdir -p "$RUNNER_TEMP/transcript-browser"
          bun add --cwd "$RUNNER_TEMP/transcript-browser" playwright@1.63.0
          bun "$RUNNER_TEMP/transcript-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-transcript-ui.ts
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-composer-ui.ts
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-bg-session-ui.ts
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-flow-regressions-ui.ts
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-settings-ui.ts
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/transcript-browser/node_modules/playwright/index.mjs" bun scripts/test-indirect-office-ui.ts

      - name: Daemon protocol and turn lifecycle
        run: bun scripts/test-indirect-daemon-protocol.ts

  daemon:
    name: Daemon (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # One NATIVE lane per shipped OS/arch — the daemon/launcher ship for
        # all six (scripts/build-indirect-all.ts) and every one of them must
        # build and pass the full suite.
        # (linux amd64 musl + the glibc-free proof run in `daemon-musl` below.)
        include:
          - name: linux amd64 glibc
            os: ubuntu-latest
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: windows amd64
            os: windows-latest
          - name: windows arm64
            os: windows-11-arm
          - name: macos arm64
            os: macos-latest
          - name: macos amd64
            os: macos-15-intel
    defaults:
      run:
        working-directory: indirect-code-daemon
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Source pin makes shell behavior reproducible and avoids release API limits.
      - uses: actions/checkout@v7
        with:
          repository: italoalmeida0/unish
          ref: 82da4f40f8f9100325a7593e40013757ca1ed7aa
          path: tmp/unish
          persist-credentials: false

      - name: Build unish for native tool tests
        working-directory: tmp/unish
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/unish-bin"
          shell_binary=unish
          if [ "$RUNNER_OS" = "Windows" ]; then shell_binary=unish.exe; fi
          go build -mod=vendor -trimpath -o "$RUNNER_TEMP/unish-bin/$shell_binary" .
          echo "$RUNNER_TEMP/unish-bin" >> "$GITHUB_PATH"
          echo "UNISH_TEST_BINARY=$RUNNER_TEMP/unish-bin/$shell_binary" >> "$GITHUB_ENV"

      # The daemon links the prebuilt QuickJS static archives in
      # packages/qjs/lib, so every lane builds with cgo enabled and a C
      # linker driver matching that archive's ABI (musl for linux, Mach-O
      # for macOS, GNU for windows). Zig is the pinned provider
      # (scripts/indirect-zig.ts) and macOS links with its own clang, which
      # has the real frameworks and SDK.
      - name: Install the pinned zig toolchain
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Select the cgo toolchain
        # Explicit bash: the Windows runner defaults to pwsh and this is a
        # POSIX shell snippet.
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     triple=x86_64-linux-gnu ;;
            Linux-ARM64)   triple=aarch64-linux-gnu ;;
            Windows-X64)   triple=x86_64-windows-gnu ;;
            Windows-ARM64) triple=aarch64-windows-gnu ;;
            macOS-X64)     triple=x86_64-macos ;;
            macOS-ARM64)   triple=aarch64-macos ;;
            *) echo "no cgo toolchain for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" != "macOS" ]; then
            echo "CC=zig cc -target $triple" >> "$GITHUB_ENV"
          fi

      - name: Vet
        run: go vet ./...

      - name: Build (native)
        run: go build ./...

      - name: Tests
        run: go test ./... -count=1 -timeout 900s

      - name: Windows sharing and slow-reader regressions
        if: runner.os == 'Windows'
        run: go test ./cmd/daemon ./internal/durable -run 'TestRunnerSlowParentNeverBlocksTheTask|TestStopThenPromptDuringWindowsSessionLock|TestSessionSaveWaitsForWindowsReader|TestWriteWaitsForWindowsStateReader' -count=5 -timeout 180s

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Real executable update and rollback
        working-directory: .
        run: |
          bun scripts/test-indirect-handoff-e2e.ts
          bun scripts/test-indirect-handoff-e2e.ts --rollback

      - name: Native Stop and follow-up protocol
        working-directory: .
        run: |
          go build -C indirect-code-daemon -o bin/protocol-fixture.exe ./cmd/daemon
          for iteration in 1 2 3; do
            DAEMON_BINARY="indirect-code-daemon/bin/protocol-fixture.exe" bun scripts/test-indirect-daemon-protocol.ts
          done

  daemon-musl:
    name: Daemon (linux amd64 musl + glibc-free proof)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # 1) Full Go suite on a musl userland: the daemon must build and pass
      #    its tests against musl libc + busybox (golang:alpine), not only on
      #    glibc distros / macOS / Windows.
      - name: Tests (musl userland, Alpine)
        run: |
          # build-base is required now that the daemon links QuickJS through
          # cgo; the archive is musl-built, so Alpine's own toolchain is the
          # exact match for it.
          docker run --rm -v "$PWD:/src" -w /src/indirect-code-daemon golang:1.26-alpine \
            sh -c "apk add --no-cache git bash build-base >/dev/null && CGO_ENABLED=1 go vet ./... && CGO_ENABLED=1 go test ./... -count=1 -timeout 900s"

      # 2) Build the REAL shipped artifacts — same script the release uses
      #    (zig cross toolchain, cgo, -trimpath, all six GOOS/GOARCH
      #    targets), so this also proves every cross target still links
      #    against its prebuilt QuickJS archive.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-go@v7
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - name: Cache the pinned zig toolchain
        uses: actions/cache@v4
        with:
          # Both locations the resolver checks: the vendored archives (a repo
          # checkout of a previous run) and the downloaded/extracted cache.
          path: |
            ~/.cache/indirect-code/toolchains
            scripts/toolchains
          key: indirect-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/indirect-zig.ts') }}
          restore-keys: indirect-zig-${{ runner.os }}-${{ runner.arch }}-

      - name: Build release artifacts (all targets)
        run: bun run build:daemon:all

      # Same validator the release workflow runs (V2-005): single-artifact
      # manifest, six platform assets, checksums, stamped version.
      - name: Verify release artifacts (shared validator)
        run: bun scripts/verify-release-dist.ts indirect-code-daemon/dist

      # 3) PROVE the linux artifacts are glibc-free: execute the shipped
      #    binaries on a bare Alpine (musl only, no glibc package installed —
      #    a glibc-linked binary cannot even exec there) and statically assert
      #    EVERY linux artifact, including the cross-built arm64 ones.
      - name: Prove glibc-free (run shipped binaries on bare Alpine)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -euxc '
            apk add --no-cache file >/dev/null
            dist=indirect-code-daemon/dist
            "$dist/indirect-code-linux-amd64" --version
            for b in "$dist"/indirect-code-linux-*; do
              file "$b"
              file "$b" | grep -q "statically linked"
            done
            echo "OK: all linux artifacts are glibc-free"
          '

  daemon-race:
    name: Daemon race (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: indirect-code-daemon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - name: Tests (race detector, full)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./... -timeout 1200s
